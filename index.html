<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intercambio Navideño</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="demo-banner" class="banner hidden" data-i18n="demoBanner">
    Modo Demo (guardado solo en este navegador). Agrega tus claves de Supabase en db.js.
  </div>

  <header class="top-bar">
    <div class="brand" data-i18n="appTitle">Intercambio Navideño</div>

    <nav class="nav-tabs">
      <button class="nav-btn active" data-view="family" data-i18n="navSanta">Intercambio</button>
      <button class="nav-btn" data-view="admin" data-i18n="navAdmin">Admin</button>
    </nav>

    <div class="top-controls">
      <button id="lang-toggle" class="icon-pill" title="Switch Language">EN</button>
      <div id="user-pill" class="user-pill hidden">
        <span id="current-user-label"></span>
        <button id="logout-btn" class="link-btn" data-i18n="logout">Salir</button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- ==================== SECRET SANTA / INTERCAMBIO VIEW ==================== -->
    <section id="view-family">
      <div id="not-started-card" class="card center hidden">
        <h2 data-i18n="comingSoonTitle">Próximamente</h2>
        <p class="muted" data-i18n="notStartedDesc">
          El organizador aún está preparando el intercambio de este año. ¡Vuelve pronto!
        </p>
      </div>

      <!-- Login / First-Time PIN Setup -->
      <div id="family-login-card" class="card hidden">
        <h1 data-i18n="loginTitle">Bienvenido</h1>
        <p class="muted" data-i18n="loginDesc">Elige tu nombre para comenzar.</p>
        <form id="family-login-form" class="stack">
          <label>
            <span data-i18n="whoAreYou">¿Quién eres?</span>
            <select id="login-name-select" required>
              <option value="">-- Selecciona tu nombre --</option>
            </select>
          </label>
          <label id="pin-label" class="hidden">
            <span id="pin-prompt-text">Ingresa tu PIN de 4 dígitos:</span>
            <input type="password" id="family-pin-input" inputmode="numeric" maxlength="4" pattern="\d{4}" placeholder="1234" required />
          </label>
          <button type="submit" id="family-login-btn" class="btn primary hidden">Entrar</button>
          <p id="family-login-error" class="error-text hidden"></p>
        </form>
      </div>

      <!-- Logged-In Dashboard -->
      <div id="family-dashboard" class="hidden">
        <!-- Secret Santa Reveal -->
        <div class="card accent-card">
          <h2 data-i18n="santaCardTitle">Intercambio</h2>
          <div class="reveal-box">
            <p id="santa-status" class="muted" data-i18n="santaReady">¿Listo para ver quién te tocó?</p>
            <div id="santa-result
